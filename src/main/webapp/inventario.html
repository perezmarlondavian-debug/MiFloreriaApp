<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Mi Florería</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f9f9f9; 
        }
        .contenedor { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1); 
            max-width: 800px;
            margin: auto;
        }
        input { 
            padding: 8px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 
        }
        th { 
            background-color: #4CAF50; 
            color: white; 
        }
        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Gestión de Inventario - Mi Florería App</h2>

        <h3>Agregar Nueva Flor</h3>
        <form onsubmit="alert('¡Flor guardada exitosamente en la base de datos!'); return false;">
            
            <label>Nombre de la Flor (Solo letras, mínimo 3):</label>
            <input type="text" placeholder="Ej: Orquídea" required minlength="3" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios">

            <label>Precio Unitario (Solo números mayores a 100):</label>
            <input type="number" placeholder="Ej: 5000" required min="100" title="Debe ingresar un valor mayor a 100">

            <label>Fecha de Ingreso:</label>
            <input type="date" required>

            <button type="submit">Guardar Producto</button>
        </form>

        <hr>

        <h3>Inventario Actual</h3>
        <table>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Rosas Rojas</td>
                <td>$ 5000</td>
                <td>120</td>|
            </tr>
            <tr>
                <td>2</td>
                <td>Girasoles</td>
                <td>$ 8000</td>
                <td>45</td>
            </tr>
        </table>
    </div>
</body>
</html>
